name: Morning Brief

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: pip install -r requirements.txt

    - run: python brief.py
  env:
    GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
